<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khata Manager Pro | Premium</title>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        
        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
        .recording-active {
            animation: subtlePulse 1.5s infinite;
            background-color: #f43f5e !important; 
            color: white !important;
            border-color: #f43f5e !important;
        }
        
        /* Premium Glass Card */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-slate-200 antialiased h-screen flex overflow-hidden relative">

    <!-- DEEP AMBIENT GLOW -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-emerald-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute top-[30%] left-[50%] w-[300px] h-[300px] bg-rose-600/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 glass-panel border-r border-white/5 h-full shadow-2xl z-20">
        <div class="p-6 flex items-center space-x-3 border-b border-white/5">
            <div class="w-9 h-9 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-book text-white text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight text-white">KhataManager</h1>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center space-x-3 bg-white/10 text-white px-4 py-3 rounded-xl font-medium border border-white/10 shadow-sm transition-all">
                <i class="fa-solid fa-table-list w-5"></i>
                <span class="text-sm">Ledger</span>
            </a>
            <a href="#" onclick="exportToCSV()" class="flex items-center space-x-3 text-slate-400 hover:text-white hover:bg-white/5 px-4 py-3 rounded-xl font-medium transition-all">
                <i class="fa-solid fa-file-arrow-down w-5"></i>
                <span class="text-sm">Download Report</span>
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col h-full relative z-10">
        
        <!-- Top App Bar -->
        <header class="glass-panel border-b border-white/5 px-5 py-4 flex items-center justify-between z-20 shadow-sm">
            <div class="md:hidden flex items-center space-x-3">
                <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-book text-white text-xs"></i>
                </div>
                <h1 class="font-bold text-lg text-white tracking-tight">KhataManager</h1>
            </div>
            <h2 class="hidden md:block font-semibold text-white text-lg">Business Ledger</h2>
            
            <div class="flex items-center space-x-3">
                <button onclick="exportToCSV()" class="md:hidden w-9 h-9 flex items-center justify-center rounded-full bg-white/5 text-slate-300 border border-white/10 hover:bg-white/10 transition-all">
                    <i class="fa-solid fa-download text-sm"></i>
                </button>
                <button onclick="toggleModal()" class="hidden md:flex items-center space-x-2 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-indigo-500/25 transition-all text-sm border border-indigo-400/30">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Entry</span>
                </button>
            </div>
        </header>

        <!-- Scrollable Ledger -->
        <div class="flex-1 overflow-y-auto p-4 md:p-6 pb-32 md:pb-6 relative" id="scroll-container">
            
            <!-- Summary Cards -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="glass-panel rounded-2xl p-5 shadow-[0_8px_32px_0_rgba(0,0,0,0.2)] relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-rose-500/10 rounded-full blur-xl group-hover:bg-rose-500/20 transition-all"></div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">To Collect (Udhar)</span>
                    <span id="total-credit" class="text-3xl font-extrabold text-white tracking-tight">₹0</span>
                </div>
                <div class="glass-panel rounded-2xl p-5 shadow-[0_8px_32px_0_rgba(0,0,0,0.2)] relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl group-hover:bg-emerald-500/20 transition-all"></div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Received (Jama)</span>
                    <span id="total-paid" class="text-3xl font-extrabold text-white tracking-tight">₹0</span>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 glass-panel rounded-3xl border-dashed border-white/10 mt-4">
                <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-clipboard-list text-2xl text-slate-500"></i>
                </div>
                <p class="text-slate-300 font-semibold">Your ledger is empty</p>
                <p class="text-slate-500 text-sm mt-1">Tap the mic to add your first entry</p>
            </div>

            <!-- Bifurcated Ledger List -->
            <div id="ledger-list" class="space-y-1 relative pb-10"></div>
        </div>

        <!-- PREMIUM BOTTOM INPUT BAR -->
        <div class="fixed md:absolute bottom-5 left-4 right-4 md:left-auto md:w-[460px] glass-panel bg-slate-950/80 rounded-2xl shadow-[0_20px_40px_rgba(0,0,0,0.5)] border border-white/10 p-2 flex items-center gap-2 z-30">
            
            <button onclick="toggleModal()" class="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-xl bg-white/5 text-slate-300 hover:bg-white/10 hover:text-white transition-all">
                <i class="fa-solid fa-keyboard"></i>
            </button>

            <button onclick="document.getElementById('receipt-upload').click()" class="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-xl bg-white/5 text-slate-300 hover:bg-white/10 hover:text-white transition-all">
                <i class="fa-solid fa-camera"></i>
            </button>
            <input type="file" id="receipt-upload" accept="image/*" capture="environment" class="hidden" onchange="uploadReceipt(event)">
            
            <div id="status-bar" class="flex-1 bg-black/40 rounded-xl border border-white/5 px-4 h-11 flex items-center justify-between text-sm text-slate-400 font-medium cursor-pointer hover:bg-black/60 transition-all shadow-inner" onclick="toggleModal()">
                <span id="status-text" class="truncate">Type, scan, or use mic...</span>
            </div>

            <button id="master-record-btn" class="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-600 text-white shadow-[0_0_15px_rgba(99,102,241,0.3)] hover:shadow-[0_0_20px_rgba(99,102,241,0.5)] transition-all border border-indigo-400/30">
                <i id="master-mic-icon" class="fa-solid fa-microphone"></i>
            </button>
        </div>
    </main>

    <!-- Manual Entry Modal -->
    <div id="manual-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-end md:items-center justify-center md:p-4 transition-all duration-300">
        <div class="glass-panel bg-slate-900/90 w-full max-w-md rounded-t-[32px] md:rounded-[32px] p-7 shadow-2xl border-t border-white/10">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-xl text-white tracking-tight">Add Manual Entry</h3>
                <button onclick="toggleModal()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-all"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Customer Name</label>
                    <input type="text" id="manual-name" placeholder="e.g. Ramesh" class="w-full p-4 border border-white/10 rounded-2xl bg-black/50 text-white placeholder-slate-600 text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-inner">
                </div>
                
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Amount</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-semibold">₹</span>
                        <input type="number" id="manual-amount" placeholder="0.00" class="w-full p-4 pl-8 border border-white/10 rounded-2xl bg-black/50 text-white placeholder-slate-600 text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all shadow-inner">
                    </div>
                </div>
                
                <div class="flex space-x-3 pt-2">
                    <button id="btn-udhar" onclick="setManualType('credit')" class="flex-1 py-3.5 rounded-2xl border-2 border-rose-500/50 bg-rose-500/10 text-rose-400 font-bold text-sm transition-all shadow-[0_0_15px_rgba(244,63,94,0.1)]">Given (Udhar)</button>
                    <button id="btn-jama" onclick="setManualType('paid')" class="flex-1 py-3.5 rounded-2xl border border-white/10 bg-white/5 text-slate-300 font-bold text-sm transition-all hover:bg-white/10">Received (Jama)</button>
                </div>
                
                <button onclick="saveManualEntry()" id="save-manual-btn" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-bold py-4 rounded-2xl shadow-[0_8px_20px_rgba(99,102,241,0.25)] hover:shadow-[0_8px_25px_rgba(99,102,241,0.4)] transition-all mt-6 border border-indigo-400/30">Save Transaction</button>
            </div>
        </div>
    </div>

    <!-- Customer Profile Khata Modal -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass-panel bg-slate-900/90 w-full max-w-sm rounded-[32px] p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-5">
                <h3 id="profile-customer-name" class="font-bold text-xl text-white capitalize tracking-tight">Account</h3>
                <button onclick="toggleProfileModal()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-all"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="bg-black/50 p-5 rounded-3xl border border-white/5 mb-6 flex items-center justify-between shadow-inner">
                <div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Net Balance</span>
                    <span id="profile-net-balance" class="text-3xl font-extrabold text-white tracking-tight">₹0</span>
                </div>
                <a id="profile-whatsapp-btn" href="#" target="_blank" class="hidden bg-gradient-to-br from-emerald-400 to-emerald-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-[0_8px_20px_rgba(16,185,129,0.3)] hover:shadow-[0_8px_25px_rgba(16,185,129,0.5)] transition-all">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                </a>
            </div>

            <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-1">History</h4>
            <div class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scroll" id="profile-transactions-list"></div>
        </div>
    </div>

    <script>
        // PWA REGISTRATION
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }

        let allTransactions = [];
        let isRecording = false;
        let totalCredit = 0;
        let totalPaid = 0;
        let manualType = 'credit';

        const ledgerList = document.getElementById('ledger-list');
        const emptyState = document.getElementById('empty-state');
        const totalCreditEl = document.getElementById('total-credit');
        const totalPaidEl = document.getElementById('total-paid');
        const masterBtn = document.getElementById('master-record-btn');
        const masterIcon = document.getElementById('master-mic-icon');
        const statusText = document.getElementById('status-text');
        const statusBar = document.getElementById('status-bar');

        function toggleModal() { document.getElementById('manual-modal').classList.toggle('hidden'); }
        function toggleProfileModal() { document.getElementById('profile-modal').classList.toggle('hidden'); }

        function setManualType(type) {
            manualType = type;
            const btnUdhar = document.getElementById('btn-udhar');
            const btnJama = document.getElementById('btn-jama');
            if (type === 'credit') {
                btnUdhar.className = "flex-1 py-3.5 rounded-2xl border-2 border-rose-500/50 bg-rose-500/10 text-rose-400 font-bold text-sm transition-all shadow-[0_0_15px_rgba(244,63,94,0.1)]";
                btnJama.className = "flex-1 py-3.5 rounded-2xl border border-white/10 bg-white/5 text-slate-300 font-bold text-sm transition-all hover:bg-white/10";
            } else {
                btnJama.className = "flex-1 py-3.5 rounded-2xl border-2 border-emerald-500/50 bg-emerald-500/10 text-emerald-400 font-bold text-sm transition-all shadow-[0_0_15px_rgba(16,185,129,0.1)]";
                btnUdhar.className = "flex-1 py-3.5 rounded-2xl border border-white/10 bg-white/5 text-slate-300 font-bold text-sm transition-all hover:bg-white/10";
            }
        }

        // --- NEW BIFURCATION (DATE GROUPING) LOGIC ---
        function formatDateGroup(dateString) {
            const date = new Date(dateString);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            const isToday = date.toDateString() === today.toDateString();
            const isYesterday = date.toDateString() === yesterday.toDateString();

            const options = { day: '2-digit', month: 'short', year: 'numeric' };
            const formatted = date.toLocaleDateString('en-IN', options);

            if (isToday) return `Today • ${formatted}`;
            if (isYesterday) return `Yesterday • ${formatted}`;
            return formatted;
        }

        function renderLedger() {
            ledgerList.innerHTML = '';
            totalCredit = 0;
            totalPaid = 0;

            if (allTransactions.length === 0) {
                emptyState.classList.remove('hidden');
                totalCreditEl.textContent = '₹0';
                totalPaidEl.textContent = '₹0';
                return;
            }
            
            emptyState.classList.add('hidden');
            const grouped = {};

            // Group by date and calculate totals
            allTransactions.forEach(t => {
                const amt = parseFloat(t.amount) || 0;
                if ((t.transaction_type || '').toLowerCase() === 'credit') {
                    totalCredit += amt;
                } else {
                    totalPaid += amt;
                }

                const dateKey = t.created_at ? new Date(t.created_at).toDateString() : new Date().toDateString();
                if (!grouped[dateKey]) grouped[dateKey] = [];
                grouped[dateKey].push(t);
            });

            totalCreditEl.textContent = `₹${totalCredit.toLocaleString('en-IN')}`;
            totalPaidEl.textContent = `₹${totalPaid.toLocaleString('en-IN')}`;

            // Sort dates from newest to oldest
            const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

            sortedDates.forEach(dateKey => {
                // STICKY DATE HEADER
                const dateHeader = document.createElement('div');
                dateHeader.className = "sticky top-0 z-10 pt-4 pb-2 mb-2 bg-[#020617]/90 backdrop-blur-md";
                dateHeader.innerHTML = `<span class="text-[11px] font-bold text-indigo-400 uppercase tracking-widest bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">${formatDateGroup(dateKey)}</span>`;
                ledgerList.appendChild(dateHeader);

                // ITEMS FOR THIS DATE
                grouped[dateKey].forEach(data => {
                    const isCredit = (data.transaction_type || '').toLowerCase() === 'credit';
                    const amount = parseFloat(data.amount) || 0;
                    const safeName = data.customer_name || 'Unknown';
                    const items = Array.isArray(data.items_purchased) && data.items_purchased.length > 0 ? data.items_purchased.join(', ') : 'Manual Entry';

                    const wrapper = document.createElement('div');
                    wrapper.id = `txn-${data.id}`;
                    wrapper.className = "bg-white/5 backdrop-blur-sm p-4 rounded-2xl border border-white/5 shadow-sm hover:bg-white/10 transition-all flex items-center justify-between mb-3 group";
                    
                    wrapper.innerHTML = `
                        <div class="flex items-center space-x-4 w-2/3" onclick="openCustomerProfile('${safeName}')" style="cursor:pointer">
                            <div class="w-11 h-11 rounded-full flex items-center justify-center text-sm font-bold shadow-inner flex-shrink-0 ${isCredit ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                                ${safeName.charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-1 truncate pr-2">
                                <h3 class="font-bold text-slate-200 capitalize text-[15px] tracking-tight">${safeName}</h3>
                                <p class="text-[12px] text-slate-500 font-medium truncate mt-0.5">${items}</p>
                            </div>
                        </div>
                        <div class="flex items-center justify-end w-1/3 space-x-3">
                            <div class="text-right">
                                <span class="font-bold text-base block ${isCredit ? 'text-rose-400 drop-shadow-[0_0_8px_rgba(244,63,94,0.3)]' : 'text-emerald-400 drop-shadow-[0_0_8px_rgba(16,185,129,0.3)]'}">₹${amount}</span>
                            </div>
                            <button onclick="deleteTransaction('${data.id}')" class="text-slate-600 hover:text-rose-400 p-2 transition-colors opacity-0 group-hover:opacity-100">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    `;
                    ledgerList.appendChild(wrapper);
                });
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/transactions');
                if (res.ok) {
                    allTransactions = await res.json();
                    renderLedger(); // Renders the beautiful bifurcated list
                }
            } catch (err) {}
        });

        // Delete, Save, Audio, Image - All updated to use renderLedger()
        async function deleteTransaction(id) {
            if (!confirm("Delete record?")) return;
            try {
                const res = await fetch(`/transactions/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    allTransactions = allTransactions.filter(t => t.id !== id);
                    renderLedger();
                }
            } catch (err) {}
        }

        async function saveManualEntry() {
            const name = document.getElementById('manual-name').value;
            const amount = document.getElementById('manual-amount').value;
            const saveBtn = document.getElementById('save-manual-btn');
            if (!name || !amount) return;

            saveBtn.textContent = "Saving...";
            try {
                const res = await fetch('/add-transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_name: name, amount: parseFloat(amount), transaction_type: manualType })
                });
                if (res.ok) {
                    const data = await res.json();
                    allTransactions.unshift(data);
                    renderLedger();
                    toggleModal();
                    document.getElementById('manual-name').value = '';
                    document.getElementById('manual-amount').value = '';
                    setManualType('credit');
                }
            } catch (err) {}
            finally { saveBtn.textContent = "Save Transaction"; }
        }

        function openCustomerProfile(customerName) {
            document.getElementById('profile-customer-name').textContent = customerName;
            const container = document.getElementById('profile-transactions-list');
            container.innerHTML = '';
            let customerCredit = 0, customerPaid = 0;

            const filtered = allTransactions.filter(t => (t.customer_name || '').toLowerCase() === customerName.toLowerCase());
            filtered.forEach(t => {
                const isCredit = (t.transaction_type || '').toLowerCase() === 'credit';
                const amt = parseFloat(t.amount) || 0;
                if (isCredit) customerCredit += amt; else customerPaid += amt;

                const row = document.createElement('div');
                row.className = "bg-white/5 p-4 rounded-2xl border border-white/5 flex items-center justify-between mb-2 shadow-sm";
                row.innerHTML = `
                    <div class="flex items-center space-x-3 w-3/4">
                        <div class="w-2 h-8 rounded-full ${isCredit ? 'bg-rose-400' : 'bg-emerald-400'}"></div>
                        <div class="truncate pr-2">
                            <p class="text-xs text-slate-300 font-medium truncate">${Array.isArray(t.items_purchased) && t.items_purchased.length > 0 ? t.items_purchased.join(', ') : 'Manual Entry'}</p>
                            <p class="text-[10px] text-slate-500 mt-0.5">${new Date(t.created_at || Date.now()).toLocaleDateString('en-IN')}</p>
                        </div>
                    </div>
                    <span class="font-bold text-sm ${isCredit ? 'text-rose-400' : 'text-emerald-400'}">₹${amt}</span>
                `;
                container.appendChild(row);
            });

            const netPending = customerCredit - customerPaid;
            const netBalanceEl = document.getElementById('profile-net-balance');
            netBalanceEl.textContent = `₹${Math.abs(netPending)}`;
            netBalanceEl.className = netPending > 0 ? "text-3xl font-extrabold text-rose-400 tracking-tight" : "text-3xl font-extrabold text-emerald-400 tracking-tight";

            const waBtn = document.getElementById('profile-whatsapp-btn');
            if (netPending > 0) {
                waBtn.href = `https://wa.me/?text=${encodeURIComponent(`Hello ${customerName}, pending balance: ₹${netPending}. Please clear it.`)}`;
                waBtn.classList.remove('hidden');
            } else waBtn.classList.add('hidden');

            toggleProfileModal();
        }

        // --- AUDIO ---
        let mediaRecorder;
        let audioChunks = [];
        let activeStream = null;

        masterBtn.addEventListener('click', async () => {
            if (navigator.vibrate) navigator.vibrate(50);
            if (!isRecording) {
                try {
                    activeStream = await navigator.mediaDevices.getUserMedia({ audio: true }); 
                    mediaRecorder = new MediaRecorder(activeStream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendAudio(blob);
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    
                    masterBtn.classList.add('recording-active');
                    masterIcon.classList.replace('fa-microphone', 'fa-stop');
                    statusText.textContent = "Listening...";
                    statusText.className = "text-rose-400 font-bold truncate";
                    statusBar.classList.add('border-rose-500/30', 'bg-rose-500/10');
                } catch (err) { alert("Mic permission needed."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                if (activeStream) activeStream.getTracks().forEach(track => track.stop()); 
                
                masterBtn.classList.remove('recording-active');
                masterIcon.classList.replace('fa-stop', 'fa-microphone');
                statusText.textContent = "Saving...";
                statusText.className = "text-indigo-400 font-bold animate-pulse truncate";
                statusBar.classList.remove('border-rose-500/30', 'bg-rose-500/10');
            }
        });

        async function sendAudio(blob) {
            const formData = new FormData();
            formData.append("audio_file", blob, "recording.webm");
            try {
                const res = await fetch('/extract-audio', { method: 'POST', body: formData });
                if(!res.ok) throw new Error("API Limit");
                const transaction = await res.json();
                allTransactions.unshift(transaction);
                renderLedger();
                if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                
                statusText.textContent = "Saved successfully!";
                statusText.className = "text-emerald-400 font-bold truncate";
                setTimeout(() => {
                    statusText.textContent = "Type, scan, or use mic...";
                    statusText.className = "text-slate-400 font-medium truncate";
                }, 2000);
            } catch (err) {
                statusText.textContent = "Failed (Check Quota or Keys)";
                statusText.className = "text-rose-500 font-bold truncate";
                setTimeout(() => { statusText.className = "text-slate-400 font-medium truncate"; statusText.textContent = "Type, scan, or use mic..."; }, 3000);
            }
        }

        // --- IMAGE ---
        async function uploadReceipt(event) {
            const file = event.target.files[0];
            if (!file) return;

            statusText.textContent = "Scanning...";
            statusText.className = "text-indigo-400 font-bold animate-pulse truncate";
            statusBar.classList.add('border-indigo-500/30', 'bg-indigo-500/10');
            
            const formData = new FormData();
            formData.append("receipt_image", file);

            try {
                const res = await fetch('/extract-receipt', { method: 'POST', body: formData });
                if(!res.ok) throw new Error("API Limit");
                
                const transaction = await res.json();
                allTransactions.unshift(transaction);
                renderLedger();
                
                if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
                statusText.textContent = "Receipt saved!";
                statusText.className = "text-emerald-400 font-bold truncate";
            } catch (err) {
                statusText.textContent = "Scan failed (Check Quota or Keys)";
                statusText.className = "text-rose-500 font-bold truncate";
            } finally {
                setTimeout(() => { 
                    statusText.className = "text-slate-400 font-medium truncate"; 
                    statusText.textContent = "Type, scan, or use mic..."; 
                    statusBar.classList.remove('border-indigo-500/30', 'bg-indigo-500/10');
                    document.getElementById('receipt-upload').value = ''; 
                }, 3000);
            }
        }
        
        function exportToCSV() {
            if (allTransactions.length === 0) return alert("No data to export.");
            let csvContent = "Date,Name,Type,Amount (Rs),Items\n";
            allTransactions.forEach(t => {
                const date = t.created_at ? new Date(t.created_at).toLocaleDateString('en-IN') : new Date().toLocaleDateString('en-IN');
                const name = (t.customer_name || 'Unknown').replace(/,/g, '');
                csvContent += `${date},${name},${(t.transaction_type || '').toUpperCase()},${t.amount || 0},${Array.isArray(t.items_purchased) ? t.items_purchased.join('|') : 'Manual'}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Ledger_Report_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
